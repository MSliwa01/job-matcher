[project]
name = "job-matcher"
version = "0.1.0"
description = "Vector search, LLM extraction and scoring, an agent and an MCP server over job offers, evaluated on real application decisions"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pyyaml>=6",
  "openai>=1.60",
  "pydantic>=2",
  "onnxruntime>=1.31.1",
  "tokenizers>=0.23.3",
  "numpy>=2.5.4",
  "mcp>=1.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
jm = "job_matcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
local = ["sentence-transformers>=3", "torch>=2.6"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
