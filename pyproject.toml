[project]
name = "job-matcher"
version = "0.1.0"
description = "Hybrid search, LLM extraction and a tool-using agent over job offers, with an evaluation on real application decisions"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pyyaml>=6",
]

[project.scripts]
jm = "job_matcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
local = ["sentence-transformers>=3", "torch>=2.6"]
openai = ["openai>=1.60"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
